# Tests on every push and pull request; a tag v<VERSION> also publishes the
# release (the tarball the handheld installs from, offline). The S3 USB Wi-Fi
# firmware is built here too; a tag s3-usb-wifi-v<version> publishes its image.
name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*", "s3-usb-wifi-v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q libsdl2-2.0-0 shellcheck pyflakes3 && pipx install -q vermin
      - name: Team Stump's SandBox_Stump_On (the handheld's Stump's wizard, for its answers)
        uses: actions/checkout@v4
        with:
          repository: ruderigo/SandBox_Stump_On
          path: SandBox_Stump_On
      - name: run_tests.sh
        run: STUMP_ON="$PWD/SandBox_Stump_On" bash tests/run_tests.sh
      - name: Screenshots
        if: always()
        run: mkdir -p shots && SHOTS=shots python3 tests/test_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
  versions:
    # A pull request that changes what goes on the handheld (or onto the S3)
    # must change its version too: the screen's version is how you tell what's
    # installed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bumped where it changed
        run: |
          base="origin/${{ github.base_ref }}"
          changed() { ! git diff --quiet "$base" HEAD -- "$@"; }
          bad=0
          if changed provisioner install.sh ports firmware assets vendor && ! changed VERSION; then
            echo "::error::the app changed but VERSION ($(cat VERSION)) didn't: bump it and add its CHANGELOG.md section"
            bad=1
          fi
          if git cat-file -e "$base:s3_usb_wifi/CMakeLists.txt" 2>/dev/null \
              && changed s3_usb_wifi/main s3_usb_wifi/components s3_usb_wifi/sdkconfig.defaults \
              && [ "$(git show "$base:s3_usb_wifi/CMakeLists.txt" | grep PROJECT_VER)" = "$(grep PROJECT_VER s3_usb_wifi/CMakeLists.txt)" ]; then
            echo "::error::the S3 firmware changed but its PROJECT_VER didn't: bump it in s3_usb_wifi/CMakeLists.txt"
            bad=1
          fi
          [ "$bad" = 0 ] && echo "VERSION $(cat VERSION); S3 firmware $(sed -n 's/^set(PROJECT_VER \"\(.*\)\")/\1/p' s3_usb_wifi/CMakeLists.txt)"
          exit $bad
  s3-usb-wifi:
    # ESP-IDF v5.3.2's own image; the vendored components need nothing else
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          bash s3_usb_wifi/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: s3-usb-wifi
          path: s3_usb_wifi/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: s3-usb-wifi-build
          path: |
            s3_usb_wifi/sdkconfig
            s3_usb_wifi/build/s3_usb_wifi.elf
            s3_usb_wifi/build/s3_usb_wifi.map
            s3_usb_wifi/build/config/sdkconfig.h
      - name: Fingerprint (to compare with a local build)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          bash s3_usb_wifi/host_tests/image_fingerprint.sh
      - name: The image in firmware/ is this source's
        shell: bash
        run: |
          ver=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' s3_usb_wifi/CMakeLists.txt)
          cat s3_usb_wifi/dist/SHA256SUMS
          sha256sum "firmware/s3_usb_wifi/s3-usb-wifi-$ver.bin"
          cmp "s3_usb_wifi/dist/s3-usb-wifi-$ver.bin" "firmware/s3_usb_wifi/s3-usb-wifi-$ver.bin"
  s3-usb-wifi-dhcp:
    # its DHCP server against real clients (dhclient, dhcpcd, udhcpc) and its unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q isc-dhcp-client dhcpcd-base busybox
      - name: Unit tests
        run: bash s3_usb_wifi/host_tests/run.sh
      - name: Real DHCP clients
        run: |
          # the runner's AppArmor profile for dhclient keeps it from our temp files and hooks
          if [ -f /etc/apparmor.d/sbin.dhclient ]; then sudo apparmor_parser -R /etc/apparmor.d/sbin.dhclient || true; fi
          sudo bash s3_usb_wifi/host_tests/dhcp_clients.sh
  s3-usb-wifi-release:
    if: startsWith(github.ref, 'refs/tags/s3-usb-wifi-v')
    needs: [s3-usb-wifi, s3-usb-wifi-dhcp]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: s3-usb-wifi
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#s3-usb-wifi-v}"
          test -f "dist/s3-usb-wifi-$ver.bin" || { echo "tag $GITHUB_REF_NAME doesn't match the firmware's version"; exit 1; }
          cp firmware/licenses/S3-USB-WiFi-NOTICE.txt dist/
          gh release create "$GITHUB_REF_NAME" dist/* --title "S3 USB Wi-Fi $ver" \
            --notes-file s3_usb_wifi/CHANGELOG.md --verify-tag
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash package.sh --no-tests
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A beta (v0.3.0-beta.7) is a pre-release: the Provisioner offers it as "Sandbox".
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/RK3326-Provisioner-*.tar.gz dist/SHA256SUMS \
            --title "RK3326 Provisioner $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --verify-tag $PRE
