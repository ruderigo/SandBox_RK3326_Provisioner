<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FireFly S3 setup</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f0c; --fg:#d8e6d0; --dim:#7f9378; --acc:#9fdc6a; --line:#22301f; }
  body { background:var(--bg); color:var(--fg); font:16px/1.4 ui-monospace,Menlo,Consolas,monospace; margin:0; padding:16px; max-width:520px; }
  h1 { font-size:18px; color:var(--acc); margin:0 0 4px; }
  p.dim, .dim { color:var(--dim); font-size:14px; }
  #st { border:1px solid var(--line); padding:8px 10px; margin:12px 0; }
  ul { list-style:none; padding:0; margin:8px 0; }
  li button { width:100%; text-align:left; background:none; color:var(--fg); border:1px solid var(--line); padding:10px; margin:0 0 6px; font:inherit; cursor:pointer; }
  li button:hover, li button:focus { border-color:var(--acc); }
  label { display:block; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; background:#111811; color:var(--fg); border:1px solid var(--line); padding:10px; font:inherit; }
  .go { background:var(--acc); color:#0b0f0c; border:0; padding:10px 14px; font:inherit; margin-top:12px; cursor:pointer; }
  .plain { background:none; color:var(--dim); border:1px solid var(--line); padding:8px 12px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<h1>FireFly S3 USB Wi-Fi</h1>
<p class="dim">The networks this adapter joins for the handheld. With none in range, it joins an open Stump hotspot by itself.</p>
<div id="st">Status: …</div>

<p>Networks nearby <button class="plain" type="button" onclick="scan()">Refresh</button></p>
<ul id="nets"><li class="dim">Looking…</li></ul>

<form method="post" action="/save">
  <label for="ssid">Network name</label>
  <input id="ssid" name="ssid" maxlength="32" required autocomplete="off" autocapitalize="none">
  <label for="pw">Password <span class="dim">(empty for an open network)</span></label>
  <input id="pw" name="password" type="password" maxlength="63" autocomplete="off">
  <button class="go" type="submit">Save and join</button>
</form>

<p style="margin-top:24px">Saved networks <span class="dim">(it joins whichever is in range, the most recent first)</span></p>
<ul id="saved"><li class="dim">…</li></ul>

<form method="post" action="/forget">
  <button class="plain" type="submit">Forget them all</button>
</form>

<script>
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function status(){
  fetch('/status.json').then(function(r){return r.json();}).then(function(s){
    document.getElementById('st').innerHTML = s.ssid
      ? 'Joined <b>'+esc(s.ssid)+'</b> ('+esc(s.rssi)+' dBm), '+esc(s.ip)+' on '+esc(s.subnet)
      : (s.state==='joining' ? 'Joining <b>'+esc(s.target)+'</b>…'
        : (s.error ? 'Couldn\'t join <b>'+esc(s.target)+'</b>: '+esc(s.error.replace('_',' ')) : 'Not joined to a network yet.'));
  }).catch(function(){});
}
function scan(){
  var ul=document.getElementById('nets');
  fetch('/scan.json').then(function(r){return r.json();}).then(function(list){
    ul.innerHTML='';
    if(!list.length){ul.innerHTML='<li class="dim">None found (try Refresh).</li>';return;}
    list.forEach(function(n){
      var li=document.createElement('li'), b=document.createElement('button');
      b.type='button';
      b.textContent=n.ssid+'   '+n.rssi+' dBm'+(n.open?'   open':'');
      b.onclick=function(){document.getElementById('ssid').value=n.ssid;var p=document.getElementById('pw');p.value='';p.focus();};
      li.appendChild(b); ul.appendChild(li);
    });
  }).catch(function(){ul.innerHTML='<li class="dim">Couldn\'t list networks.</li>';});
}
function saved(){
  var ul=document.getElementById('saved');
  fetch('/networks.json').then(function(r){return r.json();}).then(function(list){
    ul.innerHTML='';
    if(!list.length){ul.innerHTML='<li class="dim">None yet.</li>';return;}
    list.forEach(function(ss){
      var li=document.createElement('li'), f=document.createElement('form'), h=document.createElement('input'), b=document.createElement('button');
      f.method='post'; f.action='/forget';
      h.type='hidden'; h.name='ssid'; h.value=ss;
      b.type='submit'; b.textContent=ss+'   (forget)';
      f.appendChild(h); f.appendChild(b); li.appendChild(f); ul.appendChild(li);
    });
  }).catch(function(){});
}
status(); scan(); saved(); setInterval(status, 4000);
</script>
</body>
</html>
